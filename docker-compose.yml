services:
  mkuu-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mkuu-foundation-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MKUU_ENV: production
      HF_HOME: /model-cache
    ports:
      - "${MKUU_PORT:-8000}:8000"
    volumes:
      - mkuu-model-cache:/model-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mkuu-model-cache:
